<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <rect width="1600" height="900" fill="#F4EFE6"/>
  <g transform="translate(100, 200)">
    <text font-family="Inter, system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#C8341B" font-weight="600">LOCAL · COLIMA</text>
    <text y="90" font-family="Fraunces, Georgia, serif" font-size="88" font-weight="800" fill="#111">El miedo</text>
    <text y="190" font-family="Fraunces, Georgia, serif" font-size="88" font-weight="800" fill="#111">que no cabe</text>
    <text y="290" font-family="Fraunces, Georgia, serif" font-size="88" font-weight="800" fill="#C8341B">en una cifra.</text>
    <text y="360" font-family="Fraunces, Georgia, serif" font-size="24" font-style="italic" fill="#6B6B6B">Entre operativos, incidentes</text>
    <text y="394" font-family="Fraunces, Georgia, serif" font-size="24" font-style="italic" fill="#6B6B6B">y percepción ciudadana.</text>
  </g>
  <g transform="translate(1270, 460)">
    <circle r="190" fill="none" stroke="#C8341B" stroke-width="2" opacity="0.15"/>
    <circle r="135" fill="none" stroke="#C8341B" stroke-width="2" opacity="0.35"/>
    <circle r="85" fill="none" stroke="#C8341B" stroke-width="3" opacity="0.65"/>
    <circle r="36" fill="#C8341B"/>
    <text y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="4" fill="#6B6B6B" font-weight="600">COLIMA · 104°O</text>
  </g>
  <line x1="100" y1="830" x2="1500" y2="830" stroke="#111" stroke-width="1"/>
  <text x="100" y="865" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#6B6B6B" font-weight="600">MERIDIANO 104 · NOTA DESTACADA</text>
  <text x="1500" y="865" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#6B6B6B">SEGURIDAD EN COLIMA</text>
</svg>
