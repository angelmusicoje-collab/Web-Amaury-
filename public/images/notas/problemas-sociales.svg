  <line x1="100" y1="830" x2="1500" y2="830" stroke="#111" stroke-width="1"/>
  <text x="100" y="865" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#6B6B6B" font-weight="600">MERIDIANO 104 · CARTOGRAFÍA EDITORIAL</text>
