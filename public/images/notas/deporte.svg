<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <rect width="1600" height="900" fill="#F4EFE6"/>
  <g transform="translate(100, 180)">
    <text font-family="Inter, system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#C8341B" font-weight="600">DEPORTE</text>
    <text y="90" font-family="Fraunces, Georgia, serif" font-size="82" font-weight="800" fill="#111">México 2026.</text>
    <text y="160" font-family="Fraunces, Georgia, serif" font-size="42" font-weight="400" fill="#6B6B6B" font-style="italic">Grupo A · Fase de grupos</text>
  </g>
  <g transform="translate(100, 420)">
    <text font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="4" fill="#C8341B" font-weight="600">JORNADA 1 · INAUGURAL</text>
    <text y="50" font-family="Fraunces, Georgia, serif" font-size="40" font-weight="700" fill="#111">México vs. Sudáfrica</text>
    <text y="82" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#6B6B6B">Estadio Ciudad de México</text>
    <line x1="0" y1="105" x2="880" y2="105" stroke="#111" stroke-width="1"/>
  </g>
  <g transform="translate(100, 555)">
    <text font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="4" fill="#6B6B6B" font-weight="600">JORNADA 2</text>
    <text y="50" font-family="Fraunces, Georgia, serif" font-size="40" font-weight="700" fill="#111">México vs. Chequia</text>
    <line x1="0" y1="75" x2="880" y2="75" stroke="#111" stroke-width="1"/>
  </g>
  <g transform="translate(100, 660)">
    <text font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="4" fill="#6B6B6B" font-weight="600">JORNADA 3</text>
    <text y="50" font-family="Fraunces, Georgia, serif" font-size="40" font-weight="700" fill="#111">México vs. Corea del Sur</text>
  </g>
  <g transform="translate(1140, 380)">
    <text font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="4" fill="#6B6B6B" font-weight="600">EL FANTASMA</text>
    <text y="180" font-family="Fraunces, Georgia, serif" font-size="220" font-weight="900" fill="#C8341B">5°</text>
    <text y="220" font-family="Fraunces, Georgia, serif" font-size="32" fill="#111" font-style="italic">partido.</text>
    <text y="280" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6B6B6B">¿Será esta la</text>
    <text y="302" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6B6B6B">generación que lo</text>
    <text y="324" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6B6B6B">supere en casa?</text>
  </g>
  <line x1="100" y1="830" x2="1500" y2="830" stroke="#111" stroke-width="1"/>
  <text x="100" y="865" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#6B6B6B" font-weight="600">MERIDIANO 104 · COPA MUNDIAL DE LA FIFA 2026</text>
