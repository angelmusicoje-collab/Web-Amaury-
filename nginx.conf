server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresion basica
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Cache para assets estaticos
  location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|woff2?|ttf|ico)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Rutas Astro: build con format=directory crea /ruta/index.html
  location / {
    try_files $uri $uri/ $uri/index.html $uri.html =404;
  }

  # 404 personalizado generado por Astro
  error_page 404 /404/index.html;

  # Health check
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
