<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <rect width="1600" height="900" fill="#F4EFE6"/>
  <g transform="translate(140, 240)">
    <text font-family="Inter, system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#6B6B6B" font-weight="600">HUMANO</text>
    <text y="90" font-family="Fraunces, Georgia, serif" font-size="82" font-weight="800" fill="#111">Mirar.</text>
    <text y="180" font-family="Fraunces, Georgia, serif" font-size="82" font-weight="800" fill="#111">Pisar.</text>
    <text y="270" font-family="Fraunces, Georgia, serif" font-size="82" font-weight="800" fill="#111">Firmar.</text>
    <text y="330" font-family="Fraunces, Georgia, serif" font-size="22" font-style="italic" fill="#6B6B6B">Calle, contexto, criterio.</text>
  </g>
  <line x1="800" y1="180" x2="800" y2="720" stroke="#111" stroke-width="2"/>
  <text x="800" y="150" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" letter-spacing="6" fill="#6B6B6B" font-weight="600">VS.</text>
  <g transform="translate(860, 240)">
    <text font-family="Inter, system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#C8341B" font-weight="600">INTELIGENCIA ARTIFICIAL</text>
    <text y="90" font-family="Fraunces, Georgia, serif" font-size="82" font-weight="800" fill="#111">Producir.</text>
    <text y="180" font-family="Fraunces, Georgia, serif" font-size="82" font-weight="800" fill="#111">Resumir.</text>
    <text y="270" font-family="Fraunces, Georgia, serif" font-size="82" font-weight="800" fill="#111">Acelerar.</text>
    <text y="330" font-family="Fraunces, Georgia, serif" font-size="22" font-style="italic" fill="#6B6B6B">Herramienta, no autoridad.</text>
  </g>
  <text x="800" y="790" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="28" font-style="italic" fill="#C8341B">“Las mejores historias se cuentan bien o no sirven de nada.”</text>
  <text x="800" y="870" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="4" fill="#6B6B6B" font-weight="600">OPINIÓN · ÁNGEL FEDERICO DÍAZ BALTAZAR · MERIDIANO 104</text>
</svg>
