<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <rect width="1600" height="900" fill="#F4EFE6"/>
  <g transform="translate(100, 200)">
    <text font-family="Inter, system-ui, sans-serif" font-size="14" letter-spacing="4" fill="#C8341B" font-weight="600">PROBLEMAS SOCIALES</text>
    <text y="90" font-family="Fraunces, Georgia, serif" font-size="82" font-weight="800" fill="#111">El Pacífico</text>
    <text y="180" font-family="Fraunces, Georgia, serif" font-size="82" font-weight="800" fill="#C8341B">mexicano.</text>
    <text y="240" font-family="Inter, system-ui, sans-serif" font-size="15" letter-spacing="3" fill="#6B6B6B">RUTAS · PUERTOS · TERRITORIO</text>
  </g>
  <g transform="translate(80, 520)">
    <line x1="0" y1="0" x2="0" y2="240" stroke="#C8341B" stroke-width="3"/>
    <text x="22" y="4" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#6B6B6B" font-weight="600">UN SISTEMA,</text>
    <text x="22" y="24" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="3" fill="#6B6B6B" font-weight="600">NO EPISODIOS</text>
    <text x="22" y="72" font-family="Fraunces, Georgia, serif" font-size="22" font-style="italic" fill="#111">Rutas marítimas,</text>
    <text x="22" y="104" font-family="Fraunces, Georgia, serif" font-size="22" font-style="italic" fill="#111">puertos estratégicos</text>
    <text x="22" y="136" font-family="Fraunces, Georgia, serif" font-size="22" font-style="italic" fill="#111">y comunidades</text>
    <text x="22" y="168" font-family="Fraunces, Georgia, serif" font-size="22" font-style="italic" fill="#111">atrapadas en medio.</text>
  </g>
  <g transform="translate(1000, 100)">
