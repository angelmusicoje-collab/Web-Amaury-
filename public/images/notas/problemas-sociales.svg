    <path d="M 480 60 Q 420 180 410 300 Q 400 410 340 510 Q 280 600 220 690" fill="none" stroke="#111" stroke-width="2.5"/>
    <circle cx="435" cy="230" r="9" fill="#111"/>
    <text x="420" y="235" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#111">Mazatlán</text>
    <text x="420" y="256" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#6B6B6B">SINALOA</text>
    <circle cx="390" cy="380" r="7" fill="#111"/>
    <text x="378" y="385" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#111">Puerto Vallarta</text>
    <text x="378" y="404" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#6B6B6B">JALISCO</text>
    <circle cx="310" cy="540" r="22" fill="none" stroke="#C8341B" stroke-width="2" opacity="0.5"/>
    <circle cx="310" cy="540" r="13" fill="#C8341B"/>
    <text x="294" y="542" text-anchor="end" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="800" fill="#111">Manzanillo</text>
    <text x="294" y="568" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#C8341B" font-weight="600">COLIMA · NODO ESTRATÉGICO</text>
    <circle cx="245" cy="680" r="7" fill="#111"/>
    <text x="233" y="685" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#111">Acapulco</text>
    <text x="233" y="704" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#6B6B6B">GUERRERO</text>
